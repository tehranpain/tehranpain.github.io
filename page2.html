    function fallbackAvatar(name) {
      const initial = encodeURIComponent((name || "?").slice(0, 2));
      return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='130' height='130' viewBox='0 0 130 130'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23171717'/><stop offset='1' stop-color='%23e60012'/></linearGradient></defs><rect width='130' height='130' rx='65' fill='url(%23g)'/><text x='65' y='73' text-anchor='middle' font-size='28' font-weight='900' fill='white'>${initial}</text></svg>`;
    }

    function parseLines(raw) {
      return raw
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const match = line.match(/^(.+?)\s+(\d+(?:\.\d+)?\+?)\s*$/);
          if (!match) return null;
          const name = match[1].replace(/\*+/g, "").trim();
          const rawVal = match[2];
          return {
            name,
            val: Number(rawVal.replace("+", "")),
            displayVal: rawVal,
            avatar: avatarMap.get(name) || fallbackAvatar(name)
          };
        })
        .filter(Boolean)
        .sort((a, b) => b.val - a.val);
    }

    function render(data) {
      const body = document.getElementById("rank-panel-body");
      const podium = document.getElementById("podium");
      body.innerHTML = "";
      podium.innerHTML = "";

      document.getElementById("stat-count").textContent = "50";
      document.getElementById("stat-top").textContent = data[0] ? (data[0].displayVal || data[0].val.toLocaleString()) : "--";

      const renderRankRow = (d, rank) => {
        const row = document.createElement("div");
        row.className = "rank-row";
        const noClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
        row.innerHTML = `
          <span class="rank-no ${noClass}">${rank}</span>
          <img class="rank-avatar" src="${d.avatar}" alt="${d.name}">
          <span class="rank-name">${d.name}</span>
          <span class="rank-val">${d.displayVal || d.val.toLocaleString()}</span>
        `;
        return row;
      };

      const leftColumn = document.createElement("div");
      const rightColumn = document.createElement("div");
      leftColumn.className = "rank-column";
      rightColumn.className = "rank-column";

      data.slice(15, 33).forEach((d, i) => {
        leftColumn.appendChild(renderRankRow(d, i + 16));
      });

      data.slice(33, 50).forEach((d, i) => {
        rightColumn.appendChild(renderRankRow(d, i + 34));
      });

      body.appendChild(leftColumn);
      body.appendChild(rightColumn);

      data.slice(0, 0).forEach((d, i) => {
        const card = document.createElement("div");
        card.className = "podium-card";
        card.innerHTML = `
          <img src="${d.avatar}" alt="${d.name}">
          <div class="podium-rank">TOP ${i + 1}</div>
          <div class="podium-name">${d.name}</div>
          <div class="podium-val">${d.displayVal || d.val.toLocaleString()} 活跃乐迷</div>
        `;
        podium.appendChild(card);
      });
    }

    document.getElementById("apply-data").addEventListener("click", () => {
      render(parseLines(document.getElementById("data-input").value));
    });

    render(parseLines(document.getElementById("data-input").value));
  </script>
